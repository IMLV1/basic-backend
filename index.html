<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechSpace - ร้านขายอุปกรณ์ไอที</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- แถบนำทางด้านบน (Navbar) -->
    <nav class="navbar">
        <div class="nav-container">
            <!-- โลโก้รูปภาพ -->
            <a href="#" class="logo">
                <img src="assets/image/logo.png" alt="TechSpace Logo" class="logo-img">
            </a>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="ค้นหาการ์ดจอ, ซีพียู, เกมมิ่งเกียร์..." onkeyup="searchProducts()">
                <button onclick="searchProducts()"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
            
            <div class="nav-icons">
                <div class="cart-btn" onclick="alert('ดูตะกร้าสินค้า')">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-badge" id="cartBadge">0</span>
                </div>
                <div class="user-profile">
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>
        </div>
    </nav>

    <!-- แบนเนอร์โปรโมชั่น -->
    <section class="banner">
        <div class="banner-content">
            <h1>มหกรรมไอที ทะลุพิกัดความแรง</h1>
            <p>อัปเกรดคอมพิวเตอร์และพื้นที่ทำงานของคุณ ในราคาที่เย็นกว่าสีฟ้า ลดสูงสุด 40%</p>
            <button class="shop-now-btn">ช้อปเลย</button>
        </div>
    </section>

    <!-- หมวดหมู่สินค้า -->
    <section class="categories">
        <div class="category-item"><i class="fa-solid fa-desktop"></i><span>คอมพิวเตอร์</span></div>
        <div class="category-item"><i class="fa-solid fa-memory"></i><span>ชิ้นส่วนประกอบ</span></div>
        <div class="category-item"><i class="fa-solid fa-gamepad"></i><span>เกมมิ่งเกียร์</span></div>
        <div class="category-item"><i class="fa-solid fa-headphones"></i><span>หูฟัง & ลำโพง</span></div>
        <div class="category-item"><i class="fa-solid fa-tv"></i><span>จอมอนิเตอร์</span></div>
    </section>

    <!-- พื้นที่แสดงสินค้า -->
    <main class="main-content">
        <div class="section-header">
            <h2><i class="fa-solid fa-bolt"></i> สินค้าแนะนำประจำวัน</h2>
            <a href="#" class="view-all">ดูทั้งหมด <i class="fa-solid fa-chevron-right"></i></a>
        </div>
        
        <!-- จุดที่ JavaScript จะนำสินค้ามาแสดง -->
        <div class="product-grid" id="productList"></div>
    </main>

    <!-- เรียกใช้ไฟล์ JavaScript -->
    <script src="script.js"></script>
</body>
</html>
